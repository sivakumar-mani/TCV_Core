<div class="content-container">
  <div class="screen-toolbar">
    <h1 class="page-title">Add Material Issue</h1>
    <button class="btn-no" mat-raised-button type="button" (click)="cancel()">Cancel</button>
  </div>

  <form [formGroup]="issueForm">
    <div class="grid-2-col mt-2">
      <app-input-form-field [label]="'Issue Date'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'date'" [formControl]="$any(issueForm.controls['issue_date'])"></app-input-form-field>

      <app-select-form-field [label]="'Work Order'" [labelClass]="'form-label'" [selectClass]="'form-control'"
        [options]="workOrders" [formControl]="$any(issueForm.controls['work_order_id'])"></app-select-form-field>

      <app-select-form-field [label]="'Received By'" [labelClass]="'form-label'" [selectClass]="'form-control'"
        [options]="employees" [formControl]="$any(issueForm.controls['received_by_employee_id'])"></app-select-form-field>

      <app-select-form-field [label]="'Product'" [labelClass]="'form-label'" [selectClass]="'form-control'"
        [options]="products" [formControl]="$any(issueForm.controls['product_id'])"></app-select-form-field>

      <app-input-form-field [label]="'Requested Qty'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'number'" [formControl]="$any(issueForm.controls['requested_qty'])"></app-input-form-field>

      <app-input-form-field [label]="'Issued Qty'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'number'" [formControl]="$any(issueForm.controls['issued_qty'])"></app-input-form-field>

      <app-input-form-field [label]="'Unit'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(issueForm.controls['unit'])"></app-input-form-field>
    </div>

    <div class="grid-1-col mt-2">
      <app-textarea-form-field [label]="'Remarks'" [classLabel]="'form-label'" [rows]="3"
        [control]="$any(issueForm.controls['remarks'])"></app-textarea-form-field>
    </div>

    <div class="form-actions">
      <button class="btn-no" mat-raised-button type="button" (click)="cancel()">Cancel</button>
      <button mat-raised-button type="button" (click)="save()"
        [class]="issueForm.valid ? 'btn-yes' : 'btn-no btn-disabled'" [disabled]="!issueForm.valid">Save</button>
    </div>
  </form>
</div>
