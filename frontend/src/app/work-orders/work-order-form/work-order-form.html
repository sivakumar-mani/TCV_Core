<nav aria-label="breadcrumb" class="bg-light border-bottom px-3 py-2 mb-3">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a routerLink="/dashboard">Home</a></li>
    <li class="breadcrumb-item"><a routerLink="/work-orders">Work Orders</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ isEditMode ? 'Edit' : 'Add' }}</li>
  </ol>
</nav>

<div class="work-order-page">
  <div class="page-header">
    <h1>{{ isEditMode ? 'Edit Work Order' : 'Add Work Order' }}</h1>
    <div class="header-actions">
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Back</button>
      <button *ngIf="isEditMode" type="button" class="btn btn-outline-primary" (click)="createInvoice()">Create Invoice</button>
    </div>
  </div>

  <form [formGroup]="workOrderForm" (ngSubmit)="submit()">
    <section class="form-section">
      <h2>Work Order Header</h2>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Work Order No</label>
          <input class="form-control" type="text" formControlName="work_order_no" readonly>
        </div>
        <div class="col-md-3">
          <label class="form-label">Quotation</label>
          <select class="form-control" formControlName="quotation_id" (change)="onQuotationChange()" [attr.disabled]="isEditMode ? true : null">
            <option value="">Direct work order</option>
            <option *ngFor="let quotation of quotations" [value]="quotation.quotation_id">
              {{ quotation.quotation_no }} - {{ quotation.customer_name }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Customer</label>
          <select class="form-control" formControlName="customer_id">
            <option value="">Select customer</option>
            <option *ngFor="let customer of customers" [value]="customer.customer_id">
              {{ customer.display_customer_name || ((customer.salutation ? customer.salutation + ' ' : '') + customer.customer_name) }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Assigned To</label>
          <select class="form-control" formControlName="assigned_to_employee_id">
            <option value="">Select employee</option>
            <option *ngFor="let employee of employees" [value]="employee.employee_id">
              {{ employee.employee_code }} - {{ employee.employee_name }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Work Type</label>
          <select class="form-control" formControlName="work_type">
            <option *ngFor="let type of workTypes" [value]="type">{{ type }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select class="form-control" formControlName="work_status">
            <option *ngFor="let status of workStatuses" [value]="status">{{ status }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Priority</label>
          <select class="form-control" formControlName="priority">
            <option *ngFor="let priority of priorities" [value]="priority">{{ priority }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Supervisor</label>
          <select class="form-control" formControlName="supervisor_id">
            <option value="">Select supervisor</option>
            <option *ngFor="let employee of employees" [value]="employee.employee_id">
              {{ employee.employee_code }} - {{ employee.employee_name }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Start Date</label>
          <input class="form-control" type="date" formControlName="start_date">
        </div>
        <div class="col-md-3">
          <label class="form-label">Completion Date</label>
          <input class="form-control" type="date" formControlName="completion_date">
        </div>
        <div class="col-md-3">
          <label class="form-label">Created By</label>
          <select class="form-control" formControlName="created_by_employee_id">
            <option value="">Select employee</option>
            <option *ngFor="let employee of employees" [value]="employee.employee_id">
              {{ employee.employee_code }} - {{ employee.employee_name }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Site Contact Phone</label>
          <input class="form-control" type="text" formControlName="site_contact_phone">
        </div>
        <div class="col-md-4">
          <label class="form-label">Site Contact Person</label>
          <input class="form-control" type="text" formControlName="site_contact_person">
        </div>
        <div class="col-md-8">
          <label class="form-label">Site Address</label>
          <input class="form-control" type="text" formControlName="site_address">
        </div>
        <div class="col-md-6">
          <label class="form-label">Work Notes</label>
          <textarea class="form-control" rows="2" formControlName="work_notes"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Completion Remarks</label>
          <textarea class="form-control" rows="2" formControlName="completion_remarks"></textarea>
        </div>
      </div>
    </section>

    <section class="form-section">
      <div class="section-title-row">
        <h2>Work Items</h2>
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="addItem()">Add Item</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle work-items-table">
          <thead>
            <tr>
              <th>S.No</th>
              <th>Product</th>
              <th>Item</th>
              <th class="text-end">Qty</th>
              <th class="text-end">Rate</th>
              <th class="text-end">Tax %</th>
              <th class="text-end">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody formArrayName="items">
            <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
              <td>{{ i + 1 }}</td>
              <td>
                <select class="form-control" formControlName="product_id" (change)="onProductChange(i)">
                  <option value="">Custom item</option>
                  <option *ngFor="let product of products" [value]="product.product_id">
                    {{ product.product_code }} - {{ product.product_name }} ({{ productTypeLabel(product) }})
                  </option>
                </select>
              </td>
              <td><input class="form-control" type="text" formControlName="item_name"></td>
              <td><input class="form-control text-end" type="number" min="0.01" step="0.01" formControlName="qty"></td>
              <td><input class="form-control text-end" type="number" min="0" step="0.01" formControlName="selling_price"></td>
              <td><input class="form-control text-end" type="number" min="0" step="0.01" formControlName="tax_percent"></td>
              <td class="text-end total-cell">{{ money(lineTotal(i)) }}</td>
              <td class="text-end">
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeItem(i)">Remove</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="totals-panel">
        <div><span>Invoice Value</span><strong>{{ money(netAmount()) }}</strong></div>
      </div>
    </section>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="workOrderForm.invalid">
        {{ isEditMode ? 'Update' : 'Create Work Order' }}
      </button>
    </div>
  </form>
</div>
