<nav aria-label="breadcrumb" class="bg-light border-bottom px-3 py-2 mb-3">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a routerLink="/dashboard">Home</a></li>
    <li class="breadcrumb-item"><a routerLink="/audit-logs">Audit Logs</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ isEditMode ? 'Edit' : 'Add' }}</li>
  </ol>
</nav>

<div class="page-header">
  <h1 class="page-title">{{ isEditMode ? 'Edit Audit Log' : 'Add Audit Log' }}</h1>
</div>

<form [formGroup]="auditLogForm" (ngSubmit)="submit()" class="audit-log-form">
  <div class="form-section">
    <h2>Audit Details</h2>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">User ID</label>
        <input class="form-control" formControlName="user_id" type="number">
      </div>
      <div class="col-md-4">
        <label class="form-label">Module</label>
        <input class="form-control" formControlName="module" type="text">
      </div>
      <div class="col-md-4">
        <label class="form-label">Action</label>
        <select class="form-select" formControlName="action">
          <option value="">Select Action</option>
          <option *ngFor="let action of actions" [value]="action">{{ action }}</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Table Name</label>
        <input class="form-control" formControlName="table_name" type="text">
      </div>
      <div class="col-md-4">
        <label class="form-label">Record ID</label>
        <input class="form-control" formControlName="record_id" type="number">
      </div>
      <div class="col-md-4">
        <label class="form-label">IP Address</label>
        <input class="form-control" formControlName="ip_address" type="text">
      </div>
    </div>
  </div>

  <div class="form-section">
    <h2>Change Values</h2>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Old Values JSON</label>
        <textarea class="form-control font-monospace" formControlName="old_values" rows="8"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">New Values JSON</label>
        <textarea class="form-control font-monospace" formControlName="new_values" rows="8"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Browser Info</label>
        <textarea class="form-control" formControlName="browser_info" rows="3"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Change Reason</label>
        <textarea class="form-control" formControlName="change_reason" rows="3"></textarea>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mb-4">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="auditLogForm.invalid">
      {{ isEditMode ? 'Update' : 'Save' }}
    </button>
  </div>
</form>
