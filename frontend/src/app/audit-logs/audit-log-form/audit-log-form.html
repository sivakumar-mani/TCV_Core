<nav aria-label="breadcrumb" class="bg-light border-bottom px-3 py-2 mb-3">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a routerLink="/dashboard">Home</a></li>
    <li class="breadcrumb-item"><a routerLink="/audit-logs">Audit Logs</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ isEditMode ? 'Edit' : 'Add' }}</li>
  </ol>
</nav>

<div class="page-header">
  <h1 class="page-title">{{ isEditMode ? 'Edit Audit Log' : 'Add Audit Log' }}</h1>
</div>

<form [formGroup]="auditLogForm" (ngSubmit)="submit()" class="audit-log-form">
  <div class="form-section">
    <h2>Audit Details</h2>
    <div class="row g-3">
      <div class="col-md-4">
        <app-input-form-field [label]="'User ID'" [type]="'number'" [formControl]="$any(auditLogForm.controls['user_id'])"></app-input-form-field>
      </div>
      <div class="col-md-4">
        <app-input-form-field [label]="'Module'" [type]="'text'" [formControl]="$any(auditLogForm.controls['module'])"></app-input-form-field>
      </div>
      <div class="col-md-4">
        <app-select-form-field [label]="'Action'" [options]="actionOptionList" [formControl]="$any(auditLogForm.controls['action'])"></app-select-form-field>
      </div>
      <div class="col-md-4">
        <app-input-form-field [label]="'Table Name'" [type]="'text'" [formControl]="$any(auditLogForm.controls['table_name'])"></app-input-form-field>
      </div>
      <div class="col-md-4">
        <app-input-form-field [label]="'Record ID'" [type]="'number'" [formControl]="$any(auditLogForm.controls['record_id'])"></app-input-form-field>
      </div>
      <div class="col-md-4">
        <app-input-form-field [label]="'IP Address'" [type]="'text'" [formControl]="$any(auditLogForm.controls['ip_address'])"></app-input-form-field>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h2>Change Values</h2>
    <div class="row g-3">
      <div class="col-md-6">
        <app-textarea-form-field [label]="'Old Values JSON'" [rows]="8" [control]="$any(auditLogForm.controls['old_values'])"></app-textarea-form-field>
      </div>
      <div class="col-md-6">
        <app-textarea-form-field [label]="'New Values JSON'" [rows]="8" [control]="$any(auditLogForm.controls['new_values'])"></app-textarea-form-field>
      </div>
      <div class="col-md-6">
        <app-textarea-form-field [label]="'Browser Info'" [rows]="3" [control]="$any(auditLogForm.controls['browser_info'])"></app-textarea-form-field>
      </div>
      <div class="col-md-6">
        <app-textarea-form-field [label]="'Change Reason'" [rows]="3" [control]="$any(auditLogForm.controls['change_reason'])"></app-textarea-form-field>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mb-4">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="auditLogForm.invalid">
      {{ isEditMode ? 'Update' : 'Save' }}
    </button>
  </div>
</form>
