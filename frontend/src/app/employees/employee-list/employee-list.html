<nav aria-label="breadcrumb" class="bg-light border-bottom px-3 py-2 mb-3">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a routerLink="/dashboard">Home</a></li>
    <li class="breadcrumb-item active" aria-current="page">Employees</li>
  </ol>
</nav>

<app-ag-grid-list
  title="Employees List"
  addButtonLabel="Add Employee"
  [rowData]="employees"
  [columnDefs]="colDefs"
  [defaultColDef]="defaultColDef"
  [pagination]="pagination"
  [paginationPageSize]="paginationPageSize"
  [paginationPageSizeSelector]="paginationPageSizeSelector"
  (add)="addEmployee()">
</app-ag-grid-list>

<div class="modal-backdrop fade show" *ngIf="selectedEmployee"></div>
<div class="modal fade show d-block" tabindex="-1" *ngIf="selectedEmployee" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Employee Details</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeView()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3" *ngIf="selectedEmployee.photo_path">
          <img
            [src]="getPhotoUrl(selectedEmployee.photo_path)"
            class="employee-view-photo"
            alt="Employee photo">
        </div>
        <div class="row g-3">
          <div class="col-md-4" *ngFor="let item of selectedEmployee | keyvalue">
            <label class="form-label text-muted">{{ item.key }}</label>
            <div class="fw-semibold text-break">{{ item.value || '-' }}</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeView()">Close</button>
      </div>
    </div>
  </div>
</div>
