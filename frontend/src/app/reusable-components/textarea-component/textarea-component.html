<div class="mb-3">
  <label class="form-label">
    {{ label }} <sup *ngIf="required" class="text-danger">*</sup>
  </label>
  <textarea
    class="form-control"
    [placeholder]="label"
    [value]="value"
    (input)="change($event)"
  ></textarea>
  <app-error
    [label]="label">
  </app-error>
</div>
