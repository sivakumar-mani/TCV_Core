<div class="mb-3">
  <label class="form-label">
    {{ label }} <sup *ngIf="required" class="text-danger">*</sup>
  </label>
  <select
    class="form-select"
    [value]="value"
    (change)="change($event)"
  >

    <option value="" disabled selected>Select {{ label }}</option>

    <option
      *ngFor="let item of options"
      [value]="item.value"
    >
      {{ item.label }}
    </option>

  </select>
  <app-error
    [control]="control"
    [label]="label">
  </app-error>
</div>
