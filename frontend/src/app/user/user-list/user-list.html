<div class="content-container">
  <div class="screen-toolbar">
      <h1 class="page-title">Users List</h1>
        <button matButton="filled" (click)=" addUser()" class="btn-yes">Add User</button>
  </div>

    <div class="ag-grid-wrapper">
      <ag-grid-angular  [rowData]="userList" [columnDefs]="colDefs"  domLayout="autoHeight"
                [defaultColDef]="defaultColDef" [pagination]="pagination" [paginationPageSize]="paginationPageSize"
                [paginationPageSizeSelector]="paginationPageSizeSelector" />
                </div>

</div>
