<h5 mat-dialog-title>
   Change Password
</h5>
<mat-dialog-content>
   <div class="grid-1col mt-4">
      <form [formGroup]="changePasswordForm">
         <app-input-component
            [label]="'Old Password'"
            [type]="'password'"
            [icon]="'bi bi-lock'"
            [required]="true"
            [control]="changePasswordForm.controls['oldPassword']"
            [formControl]="$any(changePasswordForm.controls['oldPassword'])">
         </app-input-component>

         <app-input-component
            [label]="'New Password'"
            [type]="'password'"
            [icon]="'bi bi-key'"
            [required]="true"
            [control]="changePasswordForm.controls['newPassword']"
            [formControl]="$any(changePasswordForm.controls['newPassword'])">
         </app-input-component>

         <app-input-component
            [label]="'Confirm Password'"
            [type]="'password'"
            [icon]="'bi bi-shield-lock'"
            [required]="true"
            [control]="changePasswordForm.controls['confirmPassword']"
            [formControl]="$any(changePasswordForm.controls['confirmPassword'])">
         </app-input-component>
      </form>
   </div>
</mat-dialog-content>
<mat-dialog-actions>
   <div class="d-flex justify-content-between w-100">
      <button class="btn-no" mat-raised-button mat-dialog-close>Close</button>
      <button matButton [class]="changePasswordForm.valid? 'btn-yes' : 'btn-no btn-disabled'" (click)="changePassword()"
         [disabled]="changePasswordForm.invalid || changePasswordForm.errors?.['mismatch'] ">Submit</button>
   </div>
</mat-dialog-actions>
