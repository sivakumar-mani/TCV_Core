<div class="head"><div><a routerLink="/internet/customers">Internet Customers</a><h1>Internet Customer Complaints</h1></div></div><section><h2>Register Complaint</h2><div class="form"><label>Date<input type="date" [(ngModel)]="form.complaint_date"></label><label>Subject<input [(ngModel)]="form.subject"></label><label>Description<textarea [(ngModel)]="form.description"></textarea></label><button type="button" (click)="save()">Save Complaint</button></div></section><section><h2>Complaint History</h2><table><tr><th>Date</th><th>Subject</th><th>Description</th><th>Status</th></tr><tr *ngFor="let x of rows"><td>{{x.complaint_date|date:'dd-MM-yyyy'}}</td><td>{{x.subject}}</td><td>{{x.description||'-'}}</td><td>{{x.complaint_status}}</td></tr><tr *ngIf="!rows.length"><td colspan="4">No complaints registered.</td></tr></table></section>
