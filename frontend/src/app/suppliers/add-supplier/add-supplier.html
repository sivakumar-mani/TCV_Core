<mat-toolbar class="p-0 border-bottom">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#"><mat-icon>home</mat-icon></a></li>
      <li class="breadcrumb-item active" aria-current="page">Suppliers</li>
      <li class="breadcrumb-item active" aria-current="page">{{ isEditMode ? 'Edit Supplier' : 'Add Supplier' }}</li>
    </ol>
  </nav>
</mat-toolbar>

<div class="content-container">
  <div class="page-header">
    <h1 class="page-title">{{ isEditMode ? 'Edit Supplier' : 'Add Supplier' }}</h1>
    <button class="btn-no" mat-raised-button (click)="cancel()">Cancel</button>
  </div>

  <form [formGroup]="supplierForm">
    <div class="grid-2-col mt-4">
      <app-input-form-field [label]="'Supplier Name'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(supplierForm.controls['supplier_name'])"></app-input-form-field>

      <app-input-form-field [label]="'Contact Person'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(supplierForm.controls['contact_person'])"></app-input-form-field>

      <app-input-form-field [label]="'Phone'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(supplierForm.controls['phone'])"></app-input-form-field>

      <app-input-form-field [label]="'Email'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'email'" [formControl]="$any(supplierForm.controls['email'])"></app-input-form-field>

      <app-input-form-field [label]="'GST No'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(supplierForm.controls['gst_no'])"></app-input-form-field>

      <app-input-form-field [label]="'City'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(supplierForm.controls['city'])"></app-input-form-field>

      <app-input-form-field [label]="'State'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(supplierForm.controls['state'])"></app-input-form-field>

      <app-input-form-field [label]="'Pincode'" [classLabel]="'form-label'" [inputClass]="'form-control'"
        [type]="'text'" [formControl]="$any(supplierForm.controls['pincode'])"></app-input-form-field>

      <app-select-form-field [label]="'Status'" [labelClass]="'form-label'" [selectClass]="'form-control'"
        [options]="statusList" [formControl]="$any(supplierForm.controls['status'])"></app-select-form-field>
    </div>

    <div class="grid-1-col mt-2">
      <app-textarea-form-field [label]="'Address'" [classLabel]="'form-label'" [rows]="3"
        [placeholder]="'Enter address'" [control]="$any(supplierForm.controls['address'])">
      </app-textarea-form-field>
    </div>

    <div class="form-actions">
      <button class="btn-no" mat-raised-button type="button" (click)="cancel()">Cancel</button>
      <button *ngIf="!isEditMode" mat-raised-button type="button" (click)="addSubmit()"
        [class]="supplierForm.valid ? 'btn-yes' : 'btn-no btn-disabled'" [disabled]="!supplierForm.valid">Save</button>
      <button *ngIf="isEditMode" mat-raised-button type="button" (click)="editSubmit()"
        [class]="supplierForm.valid ? 'btn-yes' : 'btn-no btn-disabled'" [disabled]="!supplierForm.valid">Update</button>
    </div>
  </form>
</div>
