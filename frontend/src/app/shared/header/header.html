<div class="header">
  <mat-toolbar>
    <div class="brand">
      <span class="brand-mark">T</span>
      <span class="brand-text">TCV Core</span>
    </div>
    <button mat-icon-button (click)="toggleSidebar.emit()" class="sidebar-toggle"
      aria-label="Toggle sidebar">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <div class="header-search">
      <input type="text" placeholder="Search">
      <i class="bi bi-search" aria-hidden="true"></i>
    </div>
    <span class="mid-spacer"></span>
    <button *ngIf="permissions.can('NOTIFICATIONS')" mat-icon-button class="header-icon" aria-label="Notifications" [matMenuTriggerFor]="notificationMenu" (menuOpened)="loadNotifications()">
      <i class="bi bi-bell" aria-hidden="true"></i>
      <span class="badge-dot" *ngIf="unreadCount">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
    </button>
    <mat-menu #notificationMenu="matMenu" class="notification-menu-panel" xPosition="before">
      <div class="notification-menu" (click)="$event.stopPropagation()">
        <div class="notification-menu-header">
          <strong>Notifications</strong>
          <button type="button" (click)="markAllNotificationsRead()" [disabled]="!unreadCount">Mark all read</button>
        </div>
        <button type="button" class="notification-menu-item" *ngFor="let item of notifications"
          [class.unread]="!item.is_read" [class.critical]="item.severity === 'CRITICAL'"
          [class.warning]="item.severity === 'WARNING'" (click)="openNotification(item)">
          <span class="menu-severity-dot"></span>
          <span><strong>{{ item.title }}</strong><small>{{ item.message }}</small></span>
        </button>
        <div class="notification-menu-empty" *ngIf="!notifications.length">No active notifications</div>
        <button type="button" class="notification-view-all" (click)="viewAllNotifications()">View all notifications</button>
      </div>
    </mat-menu>
    <button mat-icon-button class="header-icon" aria-label="Messages">
      <i class="bi bi-chat" aria-hidden="true"></i>
      <span class="badge-dot success">3</span>
    </button>
    <button mat-button [matMenuTriggerFor]="menu" class="profile-trigger">
      <span class="avatar">{{ permissions.username().charAt(0).toUpperCase() }}</span>
      <span class="profile-name">{{ permissions.username() }}</span>
      <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </button>
    <mat-menu #menu="matMenu">
      <!-- <button mat-menu-item (click)="signup()">Signup</button> -->
      <button mat-menu-item (click)="changePassword()">Change Password</button>

      <button mat-menu-item (click)="logout()">Logout</button>
    </mat-menu>
  </mat-toolbar>
</div>
