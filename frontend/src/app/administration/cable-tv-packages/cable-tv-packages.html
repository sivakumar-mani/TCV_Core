<div class="page-shell">
  <div class="page-header">
    <h1>Package List</h1>
    <button type="button" (click)="openPackageModal()">Add Package</button>
  </div>

  <section class="package-panel">
    <table>
      <tr><th>Package</th><th>Type</th><th>Price</th><th>Description</th></tr>
      <tr *ngFor="let item of packages">
        <td>{{ item.package_name }}</td>
        <td>{{ item.package_type }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.description }}</td>
      </tr>
      <tr *ngIf="!packages.length">
        <td colspan="4" class="empty-row">No packages added yet.</td>
      </tr>
    </table>
  </section>

  <div class="modal-backdrop" *ngIf="showPackageModal">
    <section class="modal-panel">
      <div class="modal-header">
        <h2>Add Package</h2>
        <button type="button" class="icon-btn" (click)="closePackageModal()">x</button>
      </div>
      <form [formGroup]="packageForm" class="entry-form">
        <label>Package
          <input type="text" formControlName="package_name">
        </label>
        <label>Type
          <select formControlName="package_type">
            <option *ngFor="let type of packageTypes" [ngValue]="type">{{ type }}</option>
          </select>
        </label>
        <label>Price
          <input type="number" formControlName="price">
        </label>
        <label>Description
          <input type="text" formControlName="description">
        </label>
      </form>
      <div class="modal-actions">
        <button type="button" class="secondary-btn" (click)="closePackageModal()">Cancel</button>
        <button type="button" (click)="savePackage()">Save</button>
      </div>
    </section>
  </div>
</div>
