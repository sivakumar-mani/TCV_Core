<h2 mat-dialog-title>Products</h2>
<mat-dialog-content>

 <form [formGroup]="productForm">
        <div class="grid-2-col mt-4">
         

  <!-- Product Name -->
  <mat-form-field appearance="outline">
    <mat-label>Product Name</mat-label>
    <input matInput formControlName="product_name" placeholder="Auto generate"  readonly>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Barcode</mat-label>
    <input matInput formControlName="barcode">
  </mat-form-field>

  <!-- Brand -->
<!-- Brand -->
<mat-form-field appearance="outline">
  <mat-label>Brand</mat-label>
  <mat-select
    formControlName="brand_id"
    (selectionChange)="generateProductName()">
    <mat-option
      *ngFor="let b of brands"
      [value]="b.brand_id">
      {{b.brand_name}}
    </mat-option>
  </mat-select>
</mat-form-field>

  <!-- CATEGORY LEVELS -->
<div *ngFor="let level of levels; let i = index">
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Level {{i + 1}}</mat-label>

    <mat-select required
      [value]="selectedLevels[i]"
      (selectionChange)="onSelectLevel(i, $event.value)">

      <mat-option *ngFor="let c of level" [value]="c">
        {{c.category_name}}
      </mat-option>

    </mat-select>
  </mat-form-field>
</div>

  <!-- Purchase Price -->
  <mat-form-field appearance="outline">
    <mat-label>Purchase Price</mat-label>
    <input matInput type="number" formControlName="purchase_price">
  </mat-form-field>

  <!-- Selling Price -->
  <mat-form-field appearance="outline">
    <mat-label>Selling Price</mat-label>
    <input matInput type="number" formControlName="selling_price">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>GST %</mat-label>
    <input matInput type="number" formControlName="gst_percent">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>HSN Code</mat-label>
    <input matInput formControlName="hsn_code">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Unit</mat-label>
    <mat-select formControlName="unit">
      <mat-option value="PCS">PCS</mat-option>
      <mat-option value="BOX">BOX</mat-option>
      <mat-option value="MTR">MTR</mat-option>
      <mat-option value="KG">KG</mat-option>
      <mat-option value="SET">SET</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Stock -->
  <mat-form-field appearance="outline">
    <mat-label>Stock</mat-label>
    <input matInput type="number" formControlName="stock_qty">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Reorder Level</mat-label>
    <input matInput type="number" formControlName="reorder_level">
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option [value]="'ACTIVE'">Active</mat-option>
      <mat-option [value]="'INACTIVE'">Inactive</mat-option>
      <mat-option [value]="'DISCONTINUED'">Discontinued</mat-option>
    </mat-select>
  </mat-form-field>



        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button class="btn-no"  mat-raised-button   mat-dialog-close>Cancel</button>
    <button *ngIf="!dialogData"   mat-raised-button (click)="addSubmit()"  [class]="productForm.valid? 'btn-yes' : 'btn-no btn-disabled'"
    [disabled]="!productForm.valid">Save</button>
    <button *ngIf="dialogData"   mat-raised-button (click)="editSubmit()"  [class]="productForm.valid? 'btn-yes' : 'btn-no btn-disabled'"
    [disabled]="!productForm.valid">Update</button>
</mat-dialog-actions>
