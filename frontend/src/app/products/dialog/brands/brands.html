<h2 mat-dialog-title>{{ isViewMode ? 'View Brand' : isEditMode ? 'Edit Brand' : 'Add Brand' }}</h2>

<mat-dialog-content>
  <form [formGroup]="brandForm">
    <div class="grid-1-col mt-4">
      <app-input-form-field
        [label]="'Brand Name'"
        [classLabel]="'form-label'"
        [inputClass]="'form-control'"
        [type]="'text'"
        [formControl]="$any(brandForm.controls['brand_name'])"
        [readonly]="isViewMode">
      </app-input-form-field>

      <app-input-form-field
        [label]="'Brand Code'"
        [classLabel]="'form-label'"
        [inputClass]="'form-control'"
        [type]="'text'"
        [formControl]="$any(brandForm.controls['brand_code'])"
        [readonly]="isViewMode">
      </app-input-form-field>

      <app-textarea-form-field
        [label]="'Description'"
        [classLabel]="'form-label'"
        [rows]="4"
        [placeholder]="'Enter description'"
        [control]="$any(brandForm.controls['description'])"
        [disabled]="isViewMode">
      </app-textarea-form-field>

      <app-select-form-field
        [label]="'Status'"
        [labelClass]="'form-label'"
        [selectClass]="'form-control'"
        [options]="statusList"
        [formControl]="$any(brandForm.controls['status'])">
      </app-select-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button class="btn-no" mat-raised-button mat-dialog-close>
    {{ isViewMode ? 'Close' : 'Cancel' }}
  </button>
  <button
    *ngIf="!isEditMode && !isViewMode"
    mat-raised-button
    (click)="addSubmit()"
    [class]="brandForm.valid ? 'btn-yes' : 'btn-no btn-disabled'"
    [disabled]="brandForm.invalid">
    Save
  </button>
  <button
    *ngIf="isEditMode && !isViewMode"
    mat-raised-button
    (click)="editSubmit()"
    [class]="brandForm.valid ? 'btn-yes' : 'btn-no btn-disabled'"
    [disabled]="brandForm.invalid">
    Update
  </button>
</mat-dialog-actions>
