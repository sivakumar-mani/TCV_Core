<h2 mat-dialog-title>
  {{ isEditData ? 'Update Category' : 'Add Category' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="categoryForm">
    <div class="grid-2-col mt-4">

      <mat-form-field appearance="outline" floatLabel="always" class="w-100" *ngIf="!isEditData">
        <mat-label>Parent Category</mat-label>
        <mat-select formControlName="parent_category">
          <mat-option *ngFor="let item of parentCategory" [value]="item.value">
            {{ item.label }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="categoryForm.controls['parent_category'].hasError('required')">
          Parent category is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" floatLabel="always" class="w-100">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let status of statusOptions" [value]="status.value">
            {{ status.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <ng-container *ngIf="!isEditData">
        <mat-form-field appearance="outline" floatLabel="always" class="w-100" *ngFor="let field of levelFields">
          <mat-label>{{ field.label }}</mat-label>
          <input matInput [formControlName]="field.control" />
          <mat-error *ngIf="categoryForm.controls[field.control].hasError('required')">
            {{ field.label }} is required.
          </mat-error>
        </mat-form-field>
      </ng-container>

      <mat-form-field appearance="outline" floatLabel="always" class="w-100" *ngIf="isEditData">
        <mat-label>Category Name</mat-label>
        <input matInput formControlName="category_name" />
        <mat-error *ngIf="categoryForm.controls['category_name'].hasError('required')">
          Category name is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" floatLabel="always" class="w-100">
        <mat-label>Sort Order</mat-label>
        <input matInput type="number" formControlName="sort_order" />
      </mat-form-field>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-no" mat-raised-button mat-dialog-close>
    Cancel
  </button>

  <button
    *ngIf="!isEditData"
    mat-raised-button
    (click)="saveSubmit()"
    [disabled]="categoryForm.invalid"
    [class]="categoryForm.valid ? 'btn-yes' : 'btn-no btn-disabled'">
    Save
  </button>

  <button
    *ngIf="isEditData"
    mat-raised-button
    (click)="editSubmit()"
    [disabled]="categoryForm.invalid"
    [class]="categoryForm.valid ? 'btn-yes' : 'btn-no btn-disabled'">
    Update
  </button>
</mat-dialog-actions>
