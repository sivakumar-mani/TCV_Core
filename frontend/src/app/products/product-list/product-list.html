<mat-toolbar class="p-0 border-bottom">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#"><mat-icon>home</mat-icon></a></li>
      <li class="breadcrumb-item active" aria-current="page">Products</li>
      <li class="breadcrumb-item active" aria-current="page">Brands</li>
    </ol>
  </nav>
</mat-toolbar>
<div class="content-container">
  <div class="page-header">
    <h1 class="page-title">Brands List</h1>
    <button matButton="filled" (click)="addProduct()" class="btn-yes">Add Product</button>
  </div>

  <div class="ag-grid-wrapper">
  
<p-table #dt
    [value]="products"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10,20,50,100]"
    responsiveLayout="scroll"
    [globalFilterFields]="[
      'product_name',
      'product_code',
      'brand_name',
      'category_path',
      'price',
      'stock_qty',
      'status'
    ]"
    styleClass="p-datatable-sm p-datatable-gridlines">

    <!-- HEADER -->
    <ng-template pTemplate="header">

        <!-- SEARCH ROW -->
        <tr>
            <th>
                <p-columnFilter
                    type="text"
                    field="product_name"
                    placeholder="Search Product">
                </p-columnFilter>
            </th>

            <th>
                <p-columnFilter
                    type="text"
                    field="product_code"
                    placeholder="Search Code">
                </p-columnFilter>
            </th>

            <th>
                <p-columnFilter
                    type="text"
                    field="brand_name"
                    placeholder="Search Brand">
                </p-columnFilter>
            </th>

            <th>
                <p-columnFilter
                    type="text"
                    field="category_path"
                    placeholder="Search Category">
                </p-columnFilter>
            </th>

            <th>
                <p-columnFilter
                    type="numeric"
                    field="price"
                    placeholder="Search Price">
                </p-columnFilter>
            </th>

            <th>
                <p-columnFilter
                    type="numeric"
                    field="stock_qty"
                    placeholder="Search Stock">
                </p-columnFilter>
            </th>

            <th>
                <p-columnFilter
                    type="text"
                    field="status"
                    placeholder="Search Status">
                </p-columnFilter>
            </th>

            <th style="width:70px">
                Action
            </th>
        </tr>

        <!-- COLUMN HEADER -->
        <tr>
            <th>Product</th>
            <th>Code</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

    </ng-template>

    <!-- BODY -->
    <ng-template pTemplate="body" let-row>

        <tr>

            <td>
                {{ row.product_name }}
            </td>

            <td>
                {{ row.product_code }}
            </td>

            <td>
                {{ row.brand_name }}
            </td>

            <td>
                {{ row.category_path }}
            </td>

            <td>
                ₹ {{ row.price }}
            </td>

            <td>
                {{ row.stock_qty }}
            </td>

            <td>
                <p-tag
                    [value]="row.status"
                    [severity]="row.status === 'ACTIVE' ? 'success' : 'danger'">
                </p-tag>
            </td>

            <td>

                <p-menu #menu
                    [popup]="true"
                    [model]="getMenuItems(row)">
                </p-menu>

                <button pButton
                    type="button"
                    icon="pi pi-ellipsis-v"
                    class="p-button-text p-button-sm"
                    (click)="menu.toggle($event)">
                </button>

            </td>

        </tr>

    </ng-template>

    <!-- EMPTY -->
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="8" class="text-center p-3">
                No Products Found
            </td>
        </tr>
    </ng-template>

</p-table>
  </div>

</div>
