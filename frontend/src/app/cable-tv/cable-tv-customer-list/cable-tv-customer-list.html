<section class="customer-filter-panel">
  <div class="filter-grid">
    <label>Cust No
      <input type="search" [(ngModel)]="filters.customerNo" (ngModelChange)="applyFilters()" placeholder="Cust No">
    </label>
    <label>Old C No
      <input type="search" [(ngModel)]="filters.oldCustomerNo" (ngModelChange)="applyFilters()" placeholder="Old C No">
    </label>
    <label>Network
      <select [(ngModel)]="filters.networkId" (ngModelChange)="onNetworkChange()">
        <option value="">All Networks</option>
        <option *ngFor="let network of lookups.networks || []" [value]="network.network_id">{{ network.network_code || network.network_name }}</option>
      </select>
    </label>
    <label>Status
      <select [(ngModel)]="filters.status" (ngModelChange)="applyFilters()">
        <option value="">All Statuses</option>
        <option *ngFor="let status of statusOptions" [value]="status">{{ status === 'LEASE_LINE' ? 'Lease Line' : status }}</option>
      </select>
    </label>
    <button type="button" class="reset-btn" (click)="resetFilters()">Clear</button>
  </div>
</section>

<app-ag-grid-list
  title="Cable TV Customers"
  addButtonLabel="Add Cable Customer"
  [rowData]="customers"
  [columnDefs]="colDefs"
  [defaultColDef]="defaultColDef"
  (add)="addCustomer()">
</app-ag-grid-list>

<div class="modal-backdrop" *ngIf="selectedPackageInfo" (click)="closePackageInfo()">
  <section class="package-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Package Information</h2>
      <button type="button" class="close-btn" (click)="closePackageInfo()">x</button>
    </div>
    <div class="package-table-wrap">
      <table class="package-table">
        <thead>
          <tr><th>Package Name</th><th>Type</th><th>Amount</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let package of selectedPackageInfo.packages">
            <td>{{ package.package_name }}</td>
            <td>{{ package.package_type }}</td>
            <td class="amount-cell">{{ package.amount | number:'1.2-2' }}</td>
          </tr>
          <tr *ngIf="!selectedPackageInfo.packages.length">
            <td colspan="3" class="empty-cell">No active package information</td>
          </tr>
        </tbody>
        <tfoot>
          <tr><th colspan="2">Total</th><th class="amount-cell">{{ selectedPackageInfo.total | number:'1.2-2' }}</th></tr>
        </tfoot>
      </table>
    </div>
  </section>
</div>
