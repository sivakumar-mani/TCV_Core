<section class="customer-filter-panel">
  <div class="filter-grid">
    <label>Customer No
      <input type="search" [(ngModel)]="filters.customerNo" (ngModelChange)="applyFilters()" placeholder="Customer No">
    </label>
    <button type="button" class="reset-btn" (click)="resetFilters()">Clear</button>
  </div>
</section>

<app-ag-grid-list
  title="Cable TV Customers"
  addButtonLabel="Add Cable Customer"
  [rowData]="customers"
  [columnDefs]="colDefs"
  [defaultColDef]="defaultColDef"
  (add)="addCustomer()">
</app-ag-grid-list>

<div class="modal-backdrop" *ngIf="selectedPackageInfo" (click)="closePackageInfo()">
  <section class="package-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Package Information</h2>
      <button type="button" class="close-btn" (click)="closePackageInfo()">x</button>
    </div>
    <div class="package-detail-row">
      <span>Package Name</span>
      <strong>{{ selectedPackageInfo.package_name }}</strong>
    </div>
    <div class="package-detail-row">
      <span>Package Type</span>
      <strong>{{ selectedPackageInfo.package_type }}</strong>
    </div>
    <div class="package-detail-row">
      <span>Package Price</span>
      <strong>{{ selectedPackageInfo.package_price !== null && selectedPackageInfo.package_price !== undefined ? (selectedPackageInfo.package_price | number:'1.2-2') : '-' }}</strong>
    </div>
  </section>
</div>
