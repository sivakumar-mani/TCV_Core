# Example only: merge the public website location into the EXISTING HTTPS server.
# Do not replace existing /tcverp/, /api/, /uploads/, TLS or proxy configuration.
# This assumes your public site is uploaded separately to /var/www/timecablevision-public.
# Review existing locations first; nginx -t must pass before reloading.

location / {
    root /var/www/timecablevision-public;
    index index.html;
    try_files $uri $uri/ =404;
}

# Existing ERP/API locations must remain in the same server block or their
# current virtual hosts. No sample proxy targets are invented here.
